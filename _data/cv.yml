      - company: Iowa State University & Ames National Laboratory
        position: Graduate Research Assistant
        location: Ames, IA
        start_date: 2021
        end_date: 2026-04
        highlights:
          - "**AMLRO:** built an open-source active learning framework for single- and multi-objective reaction optimization, with a Flask/Streamlit GUI for open-loop use and SHAP-based explainability. Applied it to Paal-Knorr flow synthesis, closed-loop diglycolamide (DGA) flow synthesis, and aldehyde-selective Wacker oxidation in a 7-dimensional parameter space."
          - "**CyRxnOpt:** co-developed a unified interface for benchmarking reaction optimization algorithms, integrated into the RxnRover automation ecosystem."
          - "**ALSEBO:** developed a VAE-plus-Bayesian-optimization framework for data-efficient generative protein design; designed novel green fluorescent protein variants validated by MD simulations."
          - "**Enzyme thermal adaptation:** studied serine proteases and cold-adapted β-glucosidases from psychrophilic to thermophilic organisms using molecular dynamics, bioinformatics, and unsupervised machine learning."
          - "Collaborated with Oak Ridge National Laboratory and the Critical Materials Innovation Hub (CMI) on multi-objective optimization of molten salt electrochemical graphitization."

