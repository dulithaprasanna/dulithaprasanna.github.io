        position: Graduate Teaching Assistant
        location: Ames, IA
        start_date: 2021
        end_date: 2022
        highlights:
          - General chemistry laboratories and recitations (Chem 163/163L, 167L, 177L).

      - company: University of Colombo
        position: Teaching Assistant
        location: Colombo, Sri Lanka
        start_date: 2020
        end_date: 2021
        highlights:
          - Computational chemistry laboratory courses for undergraduate and M.Sc. students.

      - company: University of Colombo
        position: Undergraduate Research Assistant
        location: Colombo, Sri Lanka
        start_date: 2019
        end_date: 2020
        highlights:
          - Compared all-atom (AMBER99SB-ILDN) and united-atom (KBFF) force fields for interactions between β-amyloid and model amino acids with unsaturated side chains, using GROMACS.

    Open Source Projects:
      - name: AMLRO (Active Machine Learning Reaction Optimizer)
        url: https://github.com/RxnRover/amlro
        summary: Active learning framework for single- and multi-objective optimization of chemical reaction conditions.
        highlights:
          - Closed-loop (automated) and open-loop (human-in-the-loop) optimization, with a web GUI.
          - Explainable AI with SHAP to rank the influence of reaction variables.
          - "Released as DOE software: [doi:10.11578/dc.20260205.1](https://doi.org/10.11578/dc.20260205.1)."

      - name: ALSEBO (Active Sequence Exploration Bayesian Optimizer)
        # url: https://github.com/your-org/alsebo # TODO: add the repository link once public
        summary: Generative protein design by Bayesian optimization in a learned latent space.
        highlights:
          - Variational autoencoder (VAE) latent space for protein sequences.
          - Bayesian optimization to propose new variants with few measurements.
          - Demonstrated on avGFP fluorescence.

      - name: CyRxnOpt
        url: https://github.com/RxnRover/CyRxnOpt
        summary: Common Python interface for reaction optimization algorithms, usable from a CLI or inside self-optimizing platforms.

